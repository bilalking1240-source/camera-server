<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ابدأ الآن</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    button {
      border: none;
      padding: 16px 35px;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    #message {
      position: fixed;
      bottom: 30px;
      width: 100%;
      text-align: center;
      font-size: 15px;
      color: #555;
    }

    video,
    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <button id="startButton">ابدأ الآن</button>

  <video id="camera" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <div id="message"></div>

  <script>
    const button = document.getElementById("startButton");
    const video = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const message = document.getElementById("message");

    button.addEventListener("click", async () => {
      try {
        message.textContent = "جاري تشغيل الكاميرا...";

        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = stream;

        await new Promise(resolve => {
          video.onloadedmetadata = resolve;
        });

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );

        // الصورة موجودة داخل المتصفح فقط
        const photo = canvas.toDataURL("image/jpeg", 0.9);

        // إيقاف الكاميرا بعد الالتقاط
        stream.getTracks().forEach(track => track.stop());

        button.textContent = "تم التقاط الصورة ✓";
        button.disabled = true;
        message.textContent = "";

        console.log("Photo captured:", photo);

      } catch (error) {
        console.error(error);

        if (error.name === "NotAllowedError") {
          message.textContent = "يجب السماح باستخدام الكاميرا أولاً.";
        } else {
          message.textContent = "تعذر التقاط الصورة.";
        }
      }
    });
  </script>

</body>
</html>
