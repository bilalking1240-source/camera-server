<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بدء التجربة</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
    }

    video {
      width: 100%;
      max-height: 70vh;
      background: #000;
      border-radius: 15px;
      display: none;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 15px 30px;
      font-size: 20px;
      cursor: pointer;
      background: #2196f3;
      color: white;
    }

    button:active {
      transform: scale(0.97);
    }

    #message {
      margin-top: 20px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>✨ بدء التجربة</h1>

    <button id="cameraButton">
      ✨ بدء التجربة
    </button>

    <video id="camera" autoplay playsinline></video>

    <div id="message">
      اضغط على الزر للسماح باستخدام الكاميرا.
    </div>

  </div>

  <script>
    const button = document.getElementById("cameraButton");
    const video = document.getElementById("camera");
    const message = document.getElementById("message");

    button.addEventListener("click", async () => {
      try {
        message.textContent = "جاري طلب إذن الكاميرا...";

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user"
          },
          audio: false
        });

        video.srcObject = stream;
        video.style.display = "block";
        button.style.display = "none";

        message.textContent = "تم تشغيل الكاميرا بنجاح.";

      } catch (error) {
        console.error(error);

        message.textContent =
          "لم يتم السماح باستخدام الكاميرا. تأكد من إعطاء الإذن للمتصفح.";
      }
    });
  </script>

</body>
  </html>
